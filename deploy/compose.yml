# Production stack for a single server: Caddy (HTTPS) → app (one image) → Postgres + pgvector.
# Managed by deploy/server.sh; values come from app.env / stack.env in the deploy directory.
name: college-erp-prod

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  app:
    image: ${APP_IMAGE:-college-erp:latest}
    restart: unless-stopped
    env_file: ./app.env
    volumes:
      - ./backups:/backups:ro
    depends_on:
      db:
        condition: service_healthy
    # Not published: only Caddy reaches it on the internal network.

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: college_erp
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d college_erp"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published: no database port is reachable from outside the server.

volumes:
  db-data:
  caddy-data:
  caddy-config:
