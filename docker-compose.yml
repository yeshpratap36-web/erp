# Local development infrastructure: Postgres (with pgvector) + MinIO (S3-compatible).
name: college-erp

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: college_erp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d college_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Official minio/minio images are no longer published on Docker Hub;
  # Chainguard builds MinIO from upstream source and publishes a free :latest tag.
  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MC_HOST_local: http://minioadmin:minioadmin@localhost:9000
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: creates the private bucket. Objects are only reachable via signed URLs.
  minio-init:
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/college-erp-private &&
      mc anonymous set none local/college-erp-private
      "

  # Internal face detection/embedding service (YuNet + SFace). Stateless; never expose publicly.
  face:
    build: ./services/face
    restart: unless-stopped
    environment:
      FACE_SERVICE_TOKEN: ${FACE_SERVICE_TOKEN:?set FACE_SERVICE_TOKEN in .env}
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  minio-data:
